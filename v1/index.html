<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f1e8"><link rel="icon" href="data:,"><title>弦からつくる、小さな曲</title><link rel="stylesheet" href="style.css"></head><body><main><header><p class="eyebrow">VIOLIN COMPOSITION</p><h1>弦からつくる、<br>小さな曲。</h1><p>指の形を選んで、あなたの旋律を。</p></header><section><h2><span>01</span> 弦を選ぶ</h2><div id="strings" class="row"></div></section><section><h2><span>02</span> 指の形を選ぶ</h2><div id="presets" class="row"></div><div id="fingers"></div><div id="diagram"></div></section><section><h2><span>03</span> おわる音</h2><p class="hint">曲の最後に落ち着く音を選びます。</p><div id="endings" class="row"></div><p id="key-warning" class="hint warning"></p></section><section><div class="section-head"><h2><span>04</span> 旋律を並べる</h2><label>小節数 <select id="bars"><option value="4">4小節</option><option value="8">8小節</option></select></label></div><p class="hint">マスを選んで、画面の下のボタンで指を入れます。「ー」は前の音を伸ばす、「休」は休み。</p><button id="clear-all" type="button" class="clear-all-btn">全部消す</button><div id="measures"></div><p id="ending-hint" class="hint warning"></p></section><section><h2><span>05</span> 伴奏を選ぶ</h2><div class="field"><label for="mode">和音の決め方</label><select id="mode"><option value="melody">メロディーに合わせる</option><option value="progression">進行を選ぶ</option></select></div><div class="field" id="progression-field"><label for="progression">和音の進行</label><select id="progression"></select></div><div class="field"><label for="style">伴奏の型</label><select id="style"><option>ポップ風</option><option>バラード風</option><option>マーチ風</option></select></div><p id="clash-hint" class="hint">点線の輪は、強拍の音が和音に入っていない印です。</p></section><section class="make"><h2><span>06</span> 旋律をつくる</h2><p class="hint">今の弦と指の形で、旋律を自動で並べます。</p><button id="generate" class="wide">おまかせで並べる</button></section><section class="play-section"><h2><span>07</span> 聴いてみる</h2><div class="play-row"><button id="play" class="primary">▶ 再生</button><label class="tempo">テンポ <strong id="tempo-value">90</strong><input id="tempo" type="range" min="60" max="140" value="90"></label><label class="repeat"><input id="loop" type="checkbox"> くり返し</label></div></section><div id="dock"><div id="inputs" class="input-grid"></div></div><footer>VIOLIN COMPOSITION · 試作 v1（旧版の控え） · 2026-11-25</footer></main><script type="module" src="app.js"></script></body></html>
